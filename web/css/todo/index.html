<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100vh;
            background-color: white;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        body>div {
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            border: 1px solid #222;
            width: 300px;
            height: 600px;
            padding: 20px;
            background-color: lightskyblue;
        }

        body>div:nth-of-type(1)>div:nth-of-type(1) {
            display: flex;
            box-sizing: border-box;
            border: 1px solid #222;
            width: 100%;
            height: 40px;
            margin-bottom: 10px;

            &>input {
                flex-grow: 1;
            }

            &>button {
                padding: 5px 15px;
            }

        }


        body>div:nth-of-type(1)>button:nth-of-type(1) {
            width: 100%;
            height: 40px;
            margin-bottom: 10px;
        }

        body>div:nth-of-type(1)>div:nth-last-of-type(1) {

            box-sizing: border-box;
            border: 1px solid #222;
            padding: 5px;
            flex-grow: 1;

            &>div {
                display: flex;
                flex-direction: row;
                align-items: center;
                box-sizing: border-box;
                border: 1px solid #222;
                padding: 5px;
                margin-bottom: 5px;
                background-color: lightblue;
        

            &>input[type="checkbox"] {
                box-sizing: border-box;
                border: 1px solid #222;
                margin: 5px;
            }

            &>input[type="text"] {
                box-sizing: border-box;
                border: 1px solid #222;
                min-width: 0;

            }

            &>button {
                box-sizing: border-box;
                border: 1px solid #222;
                margin: 5px;
                flex-shrink: 0;
            }
        }

        }

        /* body>div:nth-of-type(1)>div:nth-of-type(1)>input:nth-of-type(1){

        }
        body>div:nth-of-type(1)>div:nth-of-type(1)>button:nth-of-type(1){
            width: 60px;
            height: 100%;
        } */
    </style>
</head>

<body>
    <div>
        <div>

            <button>초기화</button>
        </div>
        <button>추가버튼</button>
        <div>
            <div>
                <input type="checkbox">

            </div>

            </div>

            </div>
            <div>

            </div>
            <div>

            </div>

            </div>
            <div>

            </div>
            <div>

</body>

</html>
