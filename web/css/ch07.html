<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        div {
            border: 1px solid #222;
            border-width: 1px 1px 0px;
            /*밑에가 사라짐*/
            width: 300px;
            height: 30px;
        }

        body>div:last-of-type {
            border-bottom-width: 1px;
        }

        body>div:nth-of-type(2n) {
            border-bottom-width: 1px;
            border-top-color: rgb(221, 13, 13);
        }

        body>div:nth-last-of-type(1) {
            border-bottom-width: 1px;
        }
    </style>
</head>

<body>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
    <div></div>
</body>

</html>
