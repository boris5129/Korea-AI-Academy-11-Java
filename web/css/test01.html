<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        html,
        body {
            margin: 0;
            height: 100vh;
            overflow: auto\;
        }

        #root {
            width: 100%;
            height: 100%;
            background-color: pink;
        }

        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #00000088;
        }

        .modal {
            position: absolute;
            padding: 20px;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            width: 400px;
            height: 700px;
            background-color: #ffffff;
            border-radius: 8px;
            box-sizing: border-box;
            border: 1px solid #000;
        }

        .overlay-hidden {
            display: none;
        }
    </style>
</head>

<body>
    <div id="root">

    </div>
    <div class="overlay">
        <div class="modal">
            <button class="close">X</button>
            <h3>알림</h3>
            <p>저장되었습니다.</p>
        </div>
    </div>

    <script>
        const closeButton = document.querySelector(".close");

        closeButton.onclick = () => {
            const overlay = document.querySelector(".overlay");
            overlay.classList.add("overlay-hidden");
        }

    </script>
</body>

</html>
