<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box1 {
            margin: 10px;
            border: 1px solid#222;
            padding: 10px;
            width: 78px;
            height: 78px;
            background-color: red;
        }

        .box2 {
            margin: 10px;
            box-sizing: border-box;
            border: 1px solid#222;
            padding: 10px;
            width: 100px;
            height: 100px;
            background-color: blue;
        }

        .menu1 {
            cursor: pointer;
            padding: 0 20px;
        }

        .menu2 {
            cursor: pointer;
            margin: 20px;
        }

        .shbox {
            width: 100px;
            height: 100px;
            box-shadow: 0 0 10px 20px red inset;
        }

        .shbox2 {
            width: 100px;
            height: 100px;
            box-shadow: 0 0 5px 5px #dbdbdb;
        }
    </style>
</head>\\\

<body>
    <div class="box1"></div>
    <div class="box2"></div>
    <div>
        <span class="menu1">회사소개</span>
        <span class="menu1">고객센터</span>
    </div>
    <div>
        <span class="menu2">회사소개</span>
        <span class="menu2">고객센터</span>
    </div>
    <div class="shbox"></div>
    <div class="shbox2"></div>
</body>

</html>
